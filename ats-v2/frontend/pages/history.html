<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History - ATS Resume Analyzer v2</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%233B82F6'><path d='M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z'/><polyline points='14 2 14 8 20 8' fill='%232563EB'/></svg>">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/globals.css">
  <style>
    .history-filters {
      display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem;
    }
    .history-filters input, .history-filters select {
      background: var(--surface-1); border: 1px solid var(--border-color);
      color: var(--text-primary); padding: 0.5rem 0.75rem; border-radius: var(--radius-md);
      font-size: 0.875rem; outline: none; transition: border-color 0.2s;
    }
    .history-filters input:focus { border-color: var(--primary); }

    .history-table { width: 100%; border-collapse: collapse; }
    .history-table th {
      text-align: left; padding: 0.75rem 1rem; font-size: 0.75rem;
      text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-tertiary);
      border-bottom: 1px solid var(--border-color); font-weight: 600;
    }
    .history-table td {
      padding: 0.85rem 1rem; border-bottom: 1px solid var(--border-subtle);
      font-size: 0.875rem; color: var(--text-secondary);
    }
    .history-table tr { transition: background 0.15s; cursor: pointer; }
    .history-table tbody tr:hover { background: var(--surface-2); }

    .score-badge {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 3rem; padding: 0.25rem 0.6rem; border-radius: var(--radius-pill);
      font-size: 0.8rem; font-weight: 700;
    }
    .score-high { background: rgba(16,185,129,0.15); color: #10b981; }
    .score-mid { background: rgba(245,158,11,0.15); color: #f59e0b; }
    .score-low { background: rgba(239,68,68,0.15); color: #ef4444; }

    .tier-chip {
      font-size: 0.75rem; padding: 0.15rem 0.5rem; border-radius: var(--radius-pill);
      background: var(--surface-2); color: var(--text-tertiary);
    }

    .pagination {
      display: flex; align-items: center; justify-content: center; gap: 0.75rem;
      margin-top: 1.5rem;
    }
    .pagination button {
      background: var(--surface-1); border: 1px solid var(--border-color);
      color: var(--text-secondary); padding: 0.4rem 1rem; border-radius: var(--radius-md);
      cursor: pointer; font-size: 0.85rem; transition: all 0.2s;
    }
    .pagination button:hover:not(:disabled) { background: var(--surface-2); border-color: var(--primary); }
    .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
    .pagination .page-info { font-size: 0.85rem; color: var(--text-tertiary); }

    .detail-modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      z-index: 1000; align-items: center; justify-content: center;
      backdrop-filter: blur(4px);
    }
    .detail-modal-overlay.active { display: flex; }
    .detail-modal {
      background: var(--surface-0); border: 1px solid var(--border-color);
      border-radius: var(--radius-lg); max-width: 700px; width: 90%;
      max-height: 80vh; overflow-y: auto; padding: 2rem; position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .detail-modal .close-btn {
      position: absolute; top: 1rem; right: 1rem; background: none; border: none;
      color: var(--text-tertiary); cursor: pointer; font-size: 1.5rem;
    }
    .detail-modal h2 { margin-bottom: 1rem; }
    .detail-row { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid var(--border-subtle); }
    .detail-label { color: var(--text-tertiary); font-size: 0.85rem; }
    .detail-value { color: var(--text-primary); font-weight: 500; font-size: 0.85rem; }
    .detail-skills { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.5rem; }
    .detail-skills .skill-tag {
      font-size: 0.75rem; padding: 0.2rem 0.5rem; border-radius: var(--radius-pill);
    }
    .detail-skills .matched { background: rgba(16,185,129,0.15); color: #10b981; }
    .detail-skills .missing { background: rgba(239,68,68,0.15); color: #ef4444; }
    .justification-box {
      background: var(--surface-1); border-radius: var(--radius-md); padding: 1rem;
      margin-top: 0.75rem; font-size: 0.85rem; color: var(--text-secondary);
      line-height: 1.6; border-left: 3px solid var(--primary);
    }
  </style>
</head>
<body>
  <div class="app-layout">

    <!-- ═══ Sidebar Navigation ═══ -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          <span>ATS Analyzer</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="/" class="nav-item" id="nav-analyze">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <span class="nav-label">Analyze</span>
        </a>
        <a href="/pages/history.html" class="nav-item active" id="nav-history">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
          <span class="nav-label">History</span>
        </a>
        <a href="/pages/analytics.html" class="nav-item" id="nav-analytics">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          <span class="nav-label">Analytics</span>
        </a>
        <a href="/pages/compare.html" class="nav-item" id="nav-compare">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="18"/><rect x="14" y="3" width="7" height="18"/></svg>
          <span class="nav-label">Compare</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <button class="btn-ghost" id="theme-toggle" title="Toggle theme">
          <svg id="theme-icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg id="theme-icon-sun" class="hidden" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
        <span class="text-xs text-secondary">
          <span class="status-dot online" id="api-status"></span>
          v2.0.0
        </span>
      </div>
    </aside>

    <!-- ═══ Main Content ═══ -->
    <main class="main-content">
      <div class="page-header">
        <h1 class="page-title">Analysis History</h1>
        <p class="page-subtitle">View past resume analysis results stored in the database.</p>
      </div>

      <!-- Filters -->
      <div class="history-filters">
        <input type="text" id="filter-name" placeholder="Search by name..." style="flex:1; min-width:180px;">
        <input type="number" id="filter-min-score" placeholder="Min score" min="0" max="100" style="width:100px;">
        <input type="number" id="filter-max-score" placeholder="Max score" min="0" max="100" style="width:100px;">
        <button class="btn btn-primary" id="filter-btn" style="padding:0.5rem 1.2rem;">Search</button>
      </div>

      <!-- Table -->
      <div class="card" id="history-card">
        <table class="history-table">
          <thead>
            <tr>
              <th>Candidate</th>
              <th>Score</th>
              <th>Tier</th>
              <th>Config</th>
              <th>Time</th>
              <th>Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="history-tbody">
            <tr><td colspan="6" style="text-align:center; padding:3rem; color:var(--text-tertiary);">Loading...</td></tr>
          </tbody>
        </table>

        <!-- Pagination -->
        <div class="pagination">
          <button id="prev-btn" disabled>&larr; Previous</button>
          <span class="page-info" id="page-info">Page 1</span>
          <button id="next-btn" disabled>Next &rarr;</button>
        </div>
      </div>

      <!-- Empty State -->
      <div class="empty-state card" id="empty-state" style="display:none;">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
        <h3>No Analyses Found</h3>
        <p class="mt-4 text-sm text-secondary">Upload a resume on the Analyze page to get started.</p>
        <a href="/" class="btn btn-primary mt-6">Analyze a Resume</a>
      </div>
    </main>
  </div>

  <!-- Detail Modal -->
  <div class="detail-modal-overlay" id="detail-overlay">
    <div class="detail-modal" id="detail-modal">
      <button class="close-btn" id="detail-close">&times;</button>
      <h2 id="detail-name">—</h2>
      <div id="detail-content"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // ─── Theme Toggle ───
      const themeToggle = document.getElementById('theme-toggle');
      const savedTheme = localStorage.getItem('ats-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      updateThemeIcons(savedTheme);
      themeToggle.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('ats-theme', next);
        updateThemeIcons(next);
      });
      function updateThemeIcons(theme) {
        document.getElementById('theme-icon-moon').classList.toggle('hidden', theme !== 'dark');
        document.getElementById('theme-icon-sun').classList.toggle('hidden', theme === 'dark');
      }

      // ─── Health Check ───
      const apiStatus = document.getElementById('api-status');
      API.healthCheck()
        .then(() => { apiStatus.classList.add('online'); apiStatus.classList.remove('offline'); })
        .catch(() => { apiStatus.classList.add('offline'); apiStatus.classList.remove('online'); });

      // ─── State ───
      let currentPage = 1;
      const LIMIT = 15;

      // ─── Load History ───
      async function loadHistory() {
        const name = document.getElementById('filter-name').value.trim();
        const minScore = parseFloat(document.getElementById('filter-min-score').value) || 0;
        const maxScore = parseFloat(document.getElementById('filter-max-score').value) || 100;

        const tbody = document.getElementById('history-tbody');
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:2rem; color:var(--text-tertiary);">Loading...</td></tr>';

        try {
          const params = new URLSearchParams({
            page: currentPage, limit: LIMIT, name,
            min_score: minScore, max_score: maxScore
          });
          const data = await API.getHistory(currentPage, LIMIT, name);

          const historyCard = document.getElementById('history-card');
          const emptyState = document.getElementById('empty-state');

          if (data.total === 0) {
            historyCard.style.display = 'none';
            emptyState.style.display = '';
            return;
          }
          historyCard.style.display = '';
          emptyState.style.display = 'none';

          tbody.innerHTML = data.items.map(item => {
            const scoreClass = item.total_score >= 70 ? 'score-high' : item.total_score >= 40 ? 'score-mid' : 'score-low';
            const tierLabel = ['—', 'PyMuPDF', 'pdfplumber', 'OCR', 'DOCX'][item.extraction_tier_used] || '—';
            const date = new Date(item.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            return `<tr data-id="${item.id}" style="cursor:pointer;">
              <td style="color:var(--text-primary); font-weight:500;">${item.candidate_name}</td>
              <td><span class="score-badge ${scoreClass}">${item.total_score.toFixed(1)}</span></td>
              <td><span class="tier-chip">${tierLabel}</span></td>
              <td style="color:var(--text-tertiary);">${item.scoring_config_version}</td>
              <td style="color:var(--text-tertiary);">${item.processing_time_ms}ms</td>
              <td style="color:var(--text-tertiary);">${date}</td>
              <td onclick="event.stopPropagation();" style="white-space:nowrap;">
                <a href="/pages/detail.html?id=${item.id}" class="btn btn-secondary" style="padding:0.2rem 0.65rem; font-size:0.75rem; margin-right:0.3rem;">Detail</a>
                <a href="/pages/compare.html?a=${item.id}" class="btn btn-ghost" style="padding:0.2rem 0.65rem; font-size:0.75rem;">Compare</a>
              </td>
            </tr>`;
          }).join('');

          // Pagination
          const totalPages = Math.ceil(data.total / LIMIT);
          document.getElementById('page-info').textContent = `Page ${currentPage} of ${totalPages} (${data.total} total)`;
          document.getElementById('prev-btn').disabled = currentPage <= 1;
          document.getElementById('next-btn').disabled = currentPage >= totalPages;

          // Row click -> detail page
          tbody.querySelectorAll('tr[data-id]').forEach(row => {
            row.addEventListener('click', () => {
              window.location.href = `/pages/detail.html?id=${row.dataset.id}`;
            });
          });
        } catch (err) {
          tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:2rem; color:#ef4444;">Error: ${err.message}</td></tr>`;
        }
      }

      // ─── Detail Modal ───
      async function openDetail(id) {
        const overlay = document.getElementById('detail-overlay');
        const content = document.getElementById('detail-content');
        const nameEl = document.getElementById('detail-name');

        overlay.classList.add('active');
        nameEl.textContent = 'Loading...';
        content.innerHTML = '';

        try {
          const d = await API.getAnalysis(id);
          nameEl.textContent = d.candidate_name;

          const scoreClass = d.total_score >= 70 ? 'score-high' : d.total_score >= 40 ? 'score-mid' : 'score-low';

          content.innerHTML = `
            <div class="detail-row"><span class="detail-label">Total Score</span><span class="detail-value"><span class="score-badge ${scoreClass}">${d.total_score.toFixed(1)}</span></span></div>
            <div class="detail-row"><span class="detail-label">Skill Match (35%)</span><span class="detail-value">${d.semantic_skill_match.toFixed(1)}</span></div>
            <div class="detail-row"><span class="detail-label">Experience (25%)</span><span class="detail-value">${d.experience_longevity.toFixed(1)}</span></div>
            <div class="detail-row"><span class="detail-label">Contextual Fit (40%)</span><span class="detail-value">${d.context_alignment.toFixed(1)}</span></div>
            <div class="detail-row"><span class="detail-label">Experience</span><span class="detail-value">${d.total_experience_months} months</span></div>
            <div class="detail-row"><span class="detail-label">Extraction Tier</span><span class="detail-value">${d.extraction_tier_used}</span></div>
            <div class="detail-row"><span class="detail-label">Processing Time</span><span class="detail-value">${d.processing_time_ms}ms</span></div>
            <div class="detail-row"><span class="detail-label">LLM Attempts</span><span class="detail-value">${d.llm_parse_attempts}</span></div>
            <div class="detail-row"><span class="detail-label">Regex Fallback</span><span class="detail-value">${d.used_regex_fallback ? 'Yes' : 'No'}</span></div>

            <h3 style="margin-top:1.25rem; font-size:0.9rem; color:var(--text-secondary);">Matched Skills</h3>
            <div class="detail-skills">
              ${d.matched_skills.map(s => `<span class="skill-tag matched">${s}</span>`).join('')}
              ${d.matched_skills.length === 0 ? '<span style="color:var(--text-tertiary); font-size:0.8rem;">None</span>' : ''}
            </div>

            <h3 style="margin-top:1rem; font-size:0.9rem; color:var(--text-secondary);">Missing Skills</h3>
            <div class="detail-skills">
              ${d.missing_skills.map(s => `<span class="skill-tag missing">${s}</span>`).join('')}
              ${d.missing_skills.length === 0 ? '<span style="color:var(--text-tertiary); font-size:0.8rem;">None</span>' : ''}
            </div>

            <h3 style="margin-top:1rem; font-size:0.9rem; color:var(--text-secondary);">AI Justification</h3>
            <div class="justification-box">${d.context_justification}</div>
          `;
        } catch (err) {
          nameEl.textContent = 'Error';
          content.innerHTML = `<p style="color:#ef4444;">${err.message}</p>`;
        }
      }

      document.getElementById('detail-close').addEventListener('click', () => {
        document.getElementById('detail-overlay').classList.remove('active');
      });
      document.getElementById('detail-overlay').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) e.currentTarget.classList.remove('active');
      });

      // ─── Pagination ───
      document.getElementById('prev-btn').addEventListener('click', () => { currentPage--; loadHistory(); });
      document.getElementById('next-btn').addEventListener('click', () => { currentPage++; loadHistory(); });

      // ─── Filter ───
      document.getElementById('filter-btn').addEventListener('click', () => { currentPage = 1; loadHistory(); });
      document.getElementById('filter-name').addEventListener('keydown', (e) => { if (e.key === 'Enter') { currentPage = 1; loadHistory(); } });

      // Initial load
      loadHistory();
    });
  </script>
</body>
</html>
